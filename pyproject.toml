[project]
name = "model-monitoring-api"
version = "0.1.0"
description = "FastAPI prediction service for the churn model with Prometheus metrics and a z-score drift check"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "pydantic>=2.8",
    "pytest>=8.0",
    "requests>=2.32",
    "ruff>=0.6",
    "scikit-learn>=1.6",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
extend-exclude = ["common"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
